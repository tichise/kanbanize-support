<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanbanize - カンバン型タスク管理アプリ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #007AFF;
            --secondary-color: #0056b3;
            --bg-gradient: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
            --slide-duration: 10s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden;
        }

        .slider-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .slide.active {
            opacity: 1;
        }

        .slide h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .slide p {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            color: #666;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .feature-item {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .feature-item i {
            font-size: 2.5rem;
            color: #007AFF;
            margin-bottom: 1rem;
        }

        .qr-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: white;
            padding: 1rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .qr-container img {
            width: 150px;
            height: 150px;
        }

        .control-panel {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 1000;
        }

        .toggle-autoplay {
            background: #007AFF;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .toggle-autoplay:hover {
            background: #0056b3;
        }

        .slide-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ddd;
            cursor: pointer;
        }

        .indicator.active {
            background: #007AFF;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .navigation-controls {
            position: fixed;
            bottom: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 2rem;
            pointer-events: none;
        }

        .nav-button {
            background: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }

        .nav-button:hover {
            transform: scale(1.1);
        }

        .feature-screenshot {
            max-width: 80%;
            height: auto;
            margin: 2rem 0;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
        }
    </style>
</head>
<body>
    <div class="slider-container">
        <!-- スライド1: メイン紹介 -->
        <div class="slide active">
            <div class="logo">Kanbanize</div>
            <p>iOS・iPadOS・macOS標準のリマインダーと<br>自動同期するカンバン型タスク管理アプリ</p>
            <img src="app-screenshot.png" alt="アプリのスクリーンショット" class="feature-screenshot">
        </div>

        <!-- スライド2: 自動同期機能 -->
        <div class="slide">
            <h1>自動同期機能</h1>
            <p>標準リマインダーとシームレスに同期<br>EventKitを使用して常に最新の状態を維持</p>
            <img src="sync-demo.png" alt="同期機能のデモ" class="feature-screenshot">
        </div>

        <!-- スライド3: カンバンボード -->
        <div class="slide">
            <h1>カンバン型レイアウト</h1>
            <p>「TODO」「進行中」「完了」の3段階で管理<br>直感的な操作で効率的なタスク管理を実現</p>
            <img src="kanban-board.png" alt="カンバンボードの画面" class="feature-screenshot">
        </div>

        <!-- スライド4: ドラッグ＆ドロップ -->
        <div class="slide">
            <h1>ドラッグ＆ドロップ</h1>
            <p>タスクの進行状況を直感的に管理<br>スムーズな操作性でストレスフリー</p>
            <img src="drag-drop.png" alt="ドラッグ＆ドロップのデモ" class="feature-screenshot">
        </div>

        <!-- スライド5: タイトル候補機能 -->
        <div class="slide">
            <h1>タイトル候補機能</h1>
            <p>過去のタスクから候補を表示<br>素早いタスク作成をサポート</p>
            <img src="title-suggestions.png" alt="タイトル候補機能のデモ" class="feature-screenshot">
        </div>
    </div>

    <div class="qr-container">
        <img src="app-store-qr.png" alt="App Store QRコード">
        <p>App Storeで<br>ダウンロード</p>
    </div>

    <div class="navigation-controls">
        <button class="nav-button prev-slide">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="nav-button next-slide">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <div class="settings-panel">
        <button class="toggle-autoplay">
            <i class="fas fa-pause"></i> 自動再生を停止
        </button>
        <select id="duration-select">
            <option value="5000">5秒</option>
            <option value="10000" selected>10秒</option>
            <option value="15000">15秒</option>
            <option value="20000">20秒</option>
        </select>
    </div>

    <div class="slide-indicator">
        <div class="indicator active"></div>
        <div class="indicator"></div>
        <div class="indicator"></div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const indicators = document.querySelectorAll('.indicator');
        const toggleButton = document.querySelector('.toggle-autoplay');
        let isPlaying = true;
        let slideInterval;

        const prevButton = document.querySelector('.prev-slide');
        const nextButton = document.querySelector('.next-slide');

        function startAutoPlay() {
            slideInterval = setInterval(nextSlide, 10000); // 10秒ごとに切り替え
        }

        function stopAutoPlay() {
            clearInterval(slideInterval);
        }

        function updateSlide() {
            slides.forEach(slide => slide.classList.remove('active'));
            indicators.forEach(indicator => indicator.classList.remove('active'));
            
            slides[currentSlide].classList.add('active');
            indicators[currentSlide].classList.add('active');
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        }

        toggleButton.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                startAutoPlay();
                toggleButton.innerHTML = '<i class="fas fa-pause"></i> 自動再生を停止';
            } else {
                stopAutoPlay();
                toggleButton.innerHTML = '<i class="fas fa-play"></i> 自動再生を開始';
            }
        });

        indicators.forEach((indicator, index) => {
            indicator.addEventListener('click', () => {
                currentSlide = index;
                updateSlide();
            });
        });

        prevButton.addEventListener('click', () => {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            updateSlide();
        });

        nextButton.addEventListener('click', () => {
            currentSlide = (currentSlide + 1) % slides.length;
            updateSlide();
        });

        // 初期化
        startAutoPlay();
    </script>
</body>
</html>
